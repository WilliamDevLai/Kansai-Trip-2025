    <!-- Import Map for React & Icons -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

    <style>

      ::-webkit-scrollbar { width: 6px; }

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            MapPin, Calendar, CloudSun, ShoppingBag, Navigation, Plane, 
            Train, Ship, Utensils, Leaf, Plus, Trash2, Wallet, 
            ChevronDown, ChevronUp, AlertCircle, Camera, Coffee, BedDouble,
            RefreshCw, ThermometerSun, Anchor, Sparkles
        } from 'lucide-react';

        const TripApp = () => {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [expandedDay, setExpandedDay] = useState(0);
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('trip_expenses');
                return saved ? JSON.parse(saved) : [];
            });
            const [newExpense, setNewExpense] = useState({ item: '', cost: '', payer: '我' });
            
            // 初始行程資料 (圖片已更新)
            const initialItinerary = [
                {
                    day: 1,
                    date: '12/20 (六)',
                    dateStr: '2025-12-20',
                    lat: 34.69, lon: 135.19, // 神戶
                    title: '抵達關西 & 神戶移動日',
                    weather: '載入中...', 
                    temp: '--',
                    bg: 'from-orange-100 to-red-50',
                    image: 'https://i.meee.com.tw/J7INUal.png',
                    events: [
                        { time: '下午', title: '抵達關西機場 (KIX)', desc: 'JX822 航班抵達。', type: 'flight', location: '關西國際機場' },
                        { time: 'T1 1F', title: '購買高速船票', desc: '1F 櫃台買 Bay Shuttle 船票 (外國人優惠 ¥500)。', type: 'ticket' },
                        { time: 'T1 2F', title: '領取 JR 廣域券', desc: '⚠️ 重要：2F 綠色機器領票，啟用日請選「12月21日」！順便劃位指定席。', type: 'alert', location: '關西機場 JR綠色窗口' },
                        { time: '交通', title: '前往神戶機場', desc: '搭接駁車去碼頭 ➔ 搭高速船至神戶機場。', type: 'ship', location: 'Kobe-Kansai Airport Bay Shuttle' },
                        { time: '傍晚', title: '三宮轉乘', desc: '搭 Port Liner 至三宮 ➔ 轉地鐵西神山手線至西神中央站。', type: 'transport', location: 'Sannomiya Station' },
                        { time: '住宿', title: '神戶西廣場飯店', desc: 'Check-in 放行李。', type: 'stay', location: 'Kobe Plaza Hotel West' },
                        { time: '晚上', title: '神戶港夜景', desc: '搭地鐵回 Harborland，逛 Umie 聖誕市集。', type: 'spot', location: 'Kobe Harborland umie' },
                    ]
                },
                {
                    day: 2,
                    date: '12/21 (日)',
                    dateStr: '2025-12-21',
                    lat: 35.01, lon: 135.76, // 京都
                    title: '錦市場美食 & 伏見稻荷',
                    weather: '載入中...',
                    temp: '--',
                    bg: 'from-red-50 to-orange-100',
                    image: 'https://i.meee.com.tw/pbYGiVH.png',
                    events: [
                        { time: '09:00', title: '神戶 ➔ 京都', desc: '★ JR 廣域券啟用日！JR 新快速直達京都車站。', type: 'train', location: 'Kyoto Station' },
                        { time: '飯店', title: '寄放行李', desc: '京都世紀飯店 (車站旁)。', type: 'hotel', location: 'Kyoto Century Hotel' },
                        { time: '10:15', title: '錦市場 (早午餐)', desc: '必吃：豆乳甜甜圈、玉子燒、炸物。', type: 'food', location: 'Nishiki Market' },
                        { time: '12:30', title: '移動至伏見稻荷', desc: '祇園四條站搭京阪電車 ➔ 伏見稻荷站。', type: 'transport' },
                        { time: '13:00', title: '伏見稻荷大社', desc: '參觀千本鳥居。', type: 'spot', location: 'Fushimi Inari Taisha' },
                        { time: '15:30', title: '返回京都', desc: '搭 JR 奈良線回京都車站。', type: 'train' },
                        { time: '16:00', title: '★ 寄大行李', desc: '⚠️ 請飯店用宅急便將大行李寄往「12/23 大阪飯店」，只留隨身包去伊根。', type: 'alert' },
                        { time: '晚上', title: '京都站晚餐', desc: '伊勢丹百貨或拉麵小路。', type: 'food', location: 'Kyoto Ramen Koji' },
                    ]
                },
                {

                    weather: '載入中...',
                    temp: '--',
                    bg: 'from-blue-50 to-cyan-100',
                    image: 'https://i.meee.com.tw/AEQj6QV.png',
                    events: [
                        { time: '08:15', title: '京都車站進站', desc: '往 31 號月台移動。', type: 'transport' },
                        { time: '08:38', title: '★ 特急橋立 1 號', desc: '京都發車 ➔ 直達天橋立 (10:40 抵達)。', type: 'train' },
                        { time: '10:45', title: '兌換通票', desc: '出示 QR Code 換「天橋立伊根通票」，行李寄放車站置物櫃。', type: 'ticket', location: 'Amanohashidate Station' },
                        { time: '11:15', title: '巴士前往伊根', desc: '站前搭丹後巴士 (伊根線)，憑通票免費。', type: 'bus' },
                        { time: '12:20', title: '午餐：舟屋食堂', desc: '★ 必吃：寒鰤魚丼 (Buri Don)，冬季限定肥美海鮮！', type: 'food', location: 'Funaya Shokudo' },
                        { time: '13:30', title: '伊根灣遊覽船', desc: '搭船餵海鷗 (通票免費)，欣賞舟屋全景。', type: 'ship', location: 'Ine Bay Sightseeing Boat' },
                        { time: '14:30', title: '伊根散策', desc: '漫步舟屋群或造訪向井酒造。', type: 'spot', location: 'Ine no Funaya' },
                        { time: '16:03', title: '搭巴士回程', desc: '返回天橋立 (約 17:00 抵達)。', type: 'bus' },
                        { time: '18:00', title: '萬楓酒店 Check-in', desc: 'Fairfield by Marriott。', type: 'stay', location: 'Fairfield by Marriott Kyoto Amanohashidate' },
                        { time: '晚餐', title: '金ぱ銀ぱ', desc: '飯店隔壁迴轉壽司 (週一有開)。', type: 'food', location: 'Kaitenzushi Kinpa Ginpa' },
                        { time: '晚上', title: '洗衣時間', desc: '利用飯店 1 樓自助洗衣 (記得帶膠囊)。', type: 'info' },
                    ]
                },
                {
                    day: 4,
                    date: '12/23 (二)',
                    dateStr: '2025-12-23',
                    lat: 35.55, lon: 135.19, // 天橋立/西舞鶴
                    title: '赤松號 & 大阪城燈光秀',
                    weather: '載入中...',
                    temp: '--',
                    bg: 'from-stone-50 to-amber-50',
                    image: 'https://i.meee.com.tw/z0zBkzF.png',
                    events: [
                        { time: '08:30', title: '傘松公園 (昇龍觀)', desc: '搭觀光船過阿蘇海 ➔ 搭纜車上山看胯下觀景。', type: 'spot', location: 'Kasamatsu Park' },
                        { time: '早點', title: '鶴屋食堂', desc: '吃丹後寶丼 (紅米海鮮丼)。', type: 'food', location: 'Tsuruya Shokudo' },
                        { time: '11:29', title: '★ 丹後赤松 2 號', desc: '天橋立發車 (需預約券)。欣賞奈具海岸絕景。', type: 'train' },
                        { time: '12:20', title: '抵達西舞鶴', desc: '下車出站吃午餐。', type: 'transport', location: 'Nishi-Maizuru Station' },
                        { time: '午餐', title: '魚源 (Totogen)', desc: '車站步行 3 分鐘，在地人推薦海鮮定食。', type: 'food', location: 'Uogen Maizuru' },
                        { time: '14:36', title: '★ 特急舞鶴 12 號', desc: '西舞鶴發車 ➔ 京都 (16:07 抵達)。', type: 'train' },
                        { time: '16:15', title: '轉乘至大阪', desc: '京都轉乘新快速至大阪 ➔ 地鐵至心齋橋。', type: 'transport' },
                        { time: '17:00', title: '飯店領行李', desc: '入住心齋橋東方快捷，領取Day2寄來的行李。', type: 'hotel', location: 'Hotel Oriental Express Osaka Shinsaibashi' },
                        { time: '18:30', title: '★ 大阪城燈光秀', desc: 'Osaka Castle Illuminage (西之丸庭園)。欣賞冬季限定華麗燈飾。', type: 'spot', location: 'Nishinomaru Garden' },
                    ]
                },
                {
                    day: 5,
                    date: '12/24 (三)',
                    dateStr: '2025-12-24',
                    lat: 34.69, lon: 135.50, // 大阪
                    title: '復古大阪：新世界 & 通天閣',
                    weather: '載入中...',
                    temp: '--',
                    bg: 'from-yellow-50 to-orange-100',
                    image: 'https://i.meee.com.tw/ZeK4l0S.png',
                    events: [
                        { time: '上午', title: '新世界 & 通天閣', desc: '地鐵惠美須町站。感受昭和復古風情，拍誇張招牌。', type: 'spot', location: 'Shinsekai' },
                        { time: '體驗', title: '通天閣溜滑梯', desc: 'Tower Slider (使用週遊卡免費)。', type: 'play', location: 'Tsutenkaku' },
                        { time: '午餐', title: '新世界串炸', desc: '必吃大阪名物 Kushikatsu。', type: 'food', location: 'Kushikatsu Daruma Shinsekai' },
                        { time: '下午', title: '梅田購物 / 中崎町', desc: '百貨激戰區購物，或去中崎町逛文青咖啡館。', type: 'shop', location: 'Umeda' },
                        { time: '17:00', title: '梅田藍天大廈', desc: '空中庭園展望台看夜景 (聖誕期間人多請提早)。', type: 'spot', location: 'Umeda Sky Building' },
                        { time: '晚上', title: '聖誕大餐', desc: '預約心齋橋或梅田的餐廳慶祝聖誕夜 🎄', type: 'food' },
                    ]
                },
                {
                    day: 6,
                    date: '12/25 (四)',
                    dateStr: '2025-12-25',
                    lat: 34.69, lon: 135.50, // 大阪/關西
                    title: '最後採買 & 返回台灣',
                    weather: '載入中...',
                    temp: '--',
                    bg: 'from-orange-50 to-red-50',
                    image: 'https://i.meee.com.tw/zclFp4O.png',
                    events: [
                        { time: '上午', title: '退房 / 最後採買', desc: '心齋橋最後補貨 (藥妝、伴手禮)。', type: 'shop', location: 'Shinsaibashi Shopping Arcade' },
                        { time: '11:00', title: '前往關西機場', desc: '地鐵至天王寺/新大阪 ➔ 轉 ★ JR 特急 Haruka。', type: 'train' },
                        { time: '13:00', title: '抵達機場 (KIX)', desc: '辦理 JX823 登機手續、逛免稅店。', type: 'flight', location: 'Kansai International Airport' },
                        { time: '下午', title: '起飛返台', desc: '帶著滿滿的回憶回家囉！', type: 'flight' },
                    ]
                },
            ];

            const [itineraryData, setItineraryData] = useState(initialItinerary);
            const [weatherStatus, setWeatherStatus] = useState('updating'); // updating, success, error

            // Fetch Real-time Weather
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const updatedData = await Promise.all(itineraryData.map(async (day) => {
                            const url = `https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&start_date=${day.dateStr}&end_date=${day.dateStr}`;
                            
                            try {
                                const response = await fetch(url);
                                const data = await response.json();
                                
                                if (data.daily) {
                                    const code = data.daily.weather_code[0];
                                    const min = Math.round(data.daily.temperature_2m_min[0]);
                                    const max = Math.round(data.daily.temperature_2m_max[0]);
                                    
                                    // WMO Code Interpretation
                                    let weatherText = "晴朗";
                                    if (code >= 1 && code <= 3) weatherText = "多雲";
                                    if (code >= 45 && code <= 48) weatherText = "有霧";
                                    if (code >= 51 && code <= 67) weatherText = "有雨 ☔";
                                    if (code >= 71 && code <= 77) weatherText = "降雪 ❄️";
                                    if (code >= 80) weatherText = "陣雨 🌧️";

                                    return {
                                        ...day,
                                        weather: weatherText,
                                        temp: `${min}°C - ${max}°C`
                                    };
                                }
                            } catch (e) {
                                console.error("Weather fetch failed for day", day.day);
                            }
                            return { ...day, weather: "歷史平均", temp: "6-12°C" }; // Fallback
                        }));
                        
                        setItineraryData(updatedData);
                        setWeatherStatus('success');
                    } catch (error) {
                        console.error("Global weather fetch failed");
                        setWeatherStatus('error');
                    }
                };

                fetchWeather();
            }, []);

            // Save expenses
            useEffect(() => {
                localStorage.setItem('trip_expenses', JSON.stringify(expenses));
            }, [expenses]);

            const handleAddExpense = (e) => {
                e.preventDefault();
                if (!newExpense.item || !newExpense.cost) return;
                setExpenses([...expenses, { ...newExpense, id: Date.now() }]);
                setNewExpense({ item: '', cost: '', payer: '我' });
            };

            const removeExpense = (id) => {
                setExpenses(expenses.filter(ex => ex.id !== id));
            };

            const totalCost = expenses.reduce((acc, curr) => acc + Number(curr.cost), 0);

            const openMap = (location) => {
                if (!location) return;
                const query = encodeURIComponent(location);
                window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
            };

            const getIcon = (type) => {
                switch (type) {
                case 'flight': return <Plane size={18} className="text-blue-500" />;
                case 'train': return <Train size={18} className="text-green-600" />;
                case 'ship': return <Anchor size={18} className="text-blue-400" />;
                case 'bus': return <Navigation size={18} className="text-yellow-600" />;
                case 'food': return <Utensils size={18} className="text-orange-500" />;
                case 'shop': return <ShoppingBag size={18} className="text-pink-500" />;
                case 'stay': case 'hotel': return <BedDouble size={18} className="text-purple-500" />;
                case 'ticket': return <Camera size={18} className="text-teal-500" />;
                case 'alert': return <AlertCircle size={18} className="text-red-500" />;
                case 'play': return <Sparkles size={18} className="text-yellow-500" />;
                default: return <MapPin size={18} className="text-gray-500" />;
                }
            };

            return (
                <div className="min-h-screen bg-[#FFF8F0] pb-24 max-w-md mx-auto shadow-2xl relative">
                {/* Header */}
                <header className="bg-gradient-to-br from-red-600 to-orange-500 text-white p-6 rounded-b-[35px] shadow-lg sticky top-0 z-50">
                    <div className="flex justify-between items-start">
                    <div>
                        <div className="flex items-center gap-2 mb-1 opacity-90">
                        <span className="text-xs font-bold border border-white/40 px-2 py-0.5 rounded-full">JX822</span>
                        <span className="text-xs font-bold border border-white/40 px-2 py-0.5 rounded-full">6天5夜</span>
                        </div>
                        <h1 className="text-2xl font-bold tracking-wide flex items-center gap-2 drop-shadow-sm">
                        <Leaf className="fill-red-200 text-red-100" size={24}/> 京阪神聖誕旅
                        </h1>
                        <p className="text-red-100 text-xs mt-1 font-medium tracking-wider">12/20 (六) - 12/25 (四)</p>
                    </div>
                    <div className="text-center bg-white/10 backdrop-blur-sm p-2 rounded-xl border border-white/20">
                        <span className="text-2xl font-bold block leading-none">Day {expandedDay + 1}</span>
                        {weatherStatus === 'updating' ? (
                            <RefreshCw size={12} className="animate-spin mx-auto mt-1 opacity-80"/>
                        ) : (
                            <span className="text-[10px] uppercase opacity-80">Ready</span>
                        )}
                    </div>
                    </div>
                </header>

                {/* Main Content */}
                <div className="p-4 space-y-4">
                    
                    {/* TAB: ITINERARY */}
                    {activeTab === 'itinerary' && (
                    <div className="space-y-5 animate-fade-in">
                        {itineraryData.map((day, index) => (
                        <div 
                            key={day.day} 
                            className={`bg-white rounded-[24px] shadow-sm border border-orange-100/50 overflow-hidden transition-all duration-300 ${expandedDay === index ? 'ring-2 ring-red-200 shadow-md' : 'opacity-90'}`}
                        >
                            {/* Card Cover */}
                            <div 
                            onClick={() => setExpandedDay(expandedDay === index ? -1 : index)}
                            className="relative cursor-pointer h-28 group"
                            >
                            <img src={day.image} alt={day.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent" />
                            
                            <div className="absolute top-3 left-3 bg-white/90 backdrop-blur text-red-600 text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">
                                {day.date}
                            </div>
                            
                            {/* Live Weather Badge on Cover */}
                            <div className="absolute top-3 right-3 bg-black/40 backdrop-blur text-white text-[10px] px-2 py-1 rounded-full flex items-center gap-1 weather-badge">
                                {weatherStatus === 'updating' ? (
                                    <RefreshCw size={10} className="animate-spin" /> 
                                ) : (
                                    <CloudSun size={12} className="text-yellow-300"/>
                                )}
                                <span>{day.weather === '載入中...' ? '更新中' : day.temp}</span>
                            </div>

                            <div className="absolute bottom-0 left-0 p-4 w-full text-white flex justify-between items-end">
                                <div>
                                <h3 className="font-bold text-lg leading-tight shadow-black drop-shadow-md">{day.title}</h3>
                                {expandedDay !== index && <p className="text-[10px] opacity-90 mt-1 flex items-center gap-1"><MapPin size={10}/> {day.events.length} 個行程點</p>}
                                </div>
                                <div className="bg-white/20 p-1.5 rounded-full backdrop-blur-sm">
                                {expandedDay === index ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                                </div>
                            </div>
                            </div>

                            {/* Expanded Details */}
                            {expandedDay === index && (
                            <div className={`p-4 bg-gradient-to-b ${day.bg}`}>
                                {/* Weather Bar Expanded */}
                                <div className="flex items-center justify-between text-xs text-gray-600 mb-5 bg-white/80 backdrop-blur p-2.5 rounded-xl border border-white/50 shadow-sm">
                                <div className="flex items-center gap-2">
                                    <ThermometerSun size={16} className="text-red-500" />
                                    <span className="font-bold text-gray-800 text-sm">{day.weather} {day.temp}</span>
                                </div>
                                <span className="text-[10px] text-gray-500 bg-white px-2 py-0.5 rounded-full shadow-sm">
                                    {day.day === 3 || day.day === 4 ? '海邊風大' : '市區'}
                                </span>
                                </div>

                                {/* Timeline */}
                                <div className="relative border-l-2 border-red-200/60 ml-3 space-y-6 pb-2">
                                {day.events.map((event, idx) => (
                                    <div key={idx} className="ml-6 relative">
                                    <div className={`absolute -left-[31px] top-1.5 w-3.5 h-3.5 rounded-full border-2 border-white shadow-sm z-10 ${event.type === 'alert' ? 'bg-red-500 animate-pulse' : 'bg-red-300'}`}></div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-[11px] font-bold text-red-800 bg-red-100/50 px-2 py-0.5 rounded-md w-fit">{event.time}</span>
                                        <div className="bg-white/90 p-3.5 rounded-2xl shadow-sm border border-white mt-1 relative">
                                        <div className="flex justify-between items-start gap-3">
                                            <div className="flex-1">
                                            <h4 className={`font-bold text-sm flex items-center gap-2 mb-1.5 ${event.type === 'alert' ? 'text-red-600' : 'text-gray-800'}`}>
                                                {getIcon(event.type)} {event.title}
                                            </h4>
                                            <p className="text-xs text-gray-600 leading-relaxed whitespace-pre-line">{event.desc}</p>
                                            </div>
                                            {event.location && (
                                            <button onClick={(e) => { e.stopPropagation(); openMap(event.location); }} className="bg-blue-50 p-2 rounded-xl text-blue-600 hover:bg-blue-100 active:scale-95 transition-all shadow-sm flex-shrink-0">
                                                <Navigation size={18} /><span className="text-[8px] block text-center font-bold mt-0.5">GO</span>
                                            </button>
                                            )}
                                        </div>
                                        </div>
                                    </div>
                                    </div>
                                ))}
                                </div>
                            </div>
                            )}
                        </div>
                        ))}
                    </div>
                    )}

                    {/* TAB: GUIDE */}
                    {activeTab === 'guide' && (
                    <div className="space-y-4 animate-fade-in pb-20">
                        {/* Weather & Cloth */}
                        <div className="bg-white p-5 rounded-[24px] shadow-sm border border-blue-100">
                        <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-3 text-lg">
                            <CloudSun className="text-blue-500" /> 12月穿衣指南
                        </h3>
                        <div className="flex gap-4 mb-4">
                            <div className="bg-blue-50 rounded-2xl p-3 flex-1 text-center">
                            <span className="block text-2xl font-bold text-blue-600">8°C</span>
                            <span className="text-xs text-blue-400">平均氣溫</span>
                            </div>
                            <div className="bg-orange-50 rounded-2xl p-3 flex-1 text-center">
                            <span className="block text-2xl font-bold text-orange-600">乾燥</span>
                            <span className="text-xs text-orange-400">注意保濕</span>
                            </div>
                        </div>
                        <ul className="text-sm text-gray-600 space-y-2.5 bg-gray-50 p-4 rounded-xl">
                            <li className="flex gap-2"><span className="text-lg">🧣</span> <span>洋蔥式：發熱衣 + 毛衣 + 防風大衣。</span></li>
                            <li className="flex gap-2"><span className="text-lg">🧤</span> <span>伊根海邊、大阪城晚上很冷，必備帽子圍巾。</span></li>
                            <li className="flex gap-2"><span className="text-lg">👟</span> <span>每天約1萬步，請穿好走的鞋。</span></li>
                        </ul>
                        </div>

                        {/* Souvenir Check List */}
                        <div className="bg-white p-5 rounded-[24px] shadow-sm border border-pink-100">
                        <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-4 text-lg">
                            <ShoppingBag className="text-pink-500" /> 必買伴手禮清單
                        </h3>
                        <div className="space-y-2">
                            {[
                            {n:'京都北山 茶之菓', t:'京都/抹茶控必買'},
                            {n:'小倉山莊 仙貝', t:'京都/送禮首選'},
                            {n:'呼吸巧克力', t:'大阪/提拉米蘇味'},
                            {n:'551 蓬萊肉包', t:'大阪/現吃'},
                            {n:'吉伊卡哇周邊', t:'伏見稻荷/梅田'},
                            {n:'天橋立 智惠之餅', t:'天橋立/吃智慧'}
                            ].map((item, i) => (
                            <label key={i} className="flex items-center gap-3 p-3 rounded-xl hover:bg-pink-50 transition-colors cursor-pointer border border-transparent hover:border-pink-100">
                                <input type="checkbox" className="w-5 h-5 accent-pink-500 rounded-md" />
                                <div>
                                <span className="text-sm font-bold text-gray-700 block">{item.n}</span>
                                <span className="text-[10px] text-gray-400">{item.t}</span>
                                </div>
                            </label>
                            ))}
                        </div>
                        </div>
                    </div>
                    )}

                    {/* TAB: EXPENSES */}
                    {activeTab === 'expenses' && (
                    <div className="space-y-4 animate-fade-in pb-20">
                        <div className="bg-gradient-to-r from-teal-500 to-emerald-500 p-6 rounded-[24px] shadow-lg text-white relative overflow-hidden">
                        <div className="relative z-10">
                            <h3 className="text-xs font-medium opacity-90 mb-1">目前總支出 (JPY)</h3>
                            <p className="text-4xl font-bold tracking-tight">¥ {totalCost.toLocaleString()}</p>
                            <div className="mt-4 flex gap-2 text-[10px] font-bold opacity-80">
                            <span className="bg-white/20 px-2.5 py-1 rounded-lg backdrop-blur">
                                ≈ TWD {Math.round(totalCost * 0.22).toLocaleString()}
                            </span>
                            <span className="bg-white/20 px-2.5 py-1 rounded-lg backdrop-blur">
                                {expenses.length} 筆項目
                            </span>
                            </div>
                        </div>
                        <Wallet className="absolute -right-4 -bottom-4 text-white/10 w-32 h-32 rotate-12" />
                        </div>

                        {/* Input */}
                        <div className="bg-white p-4 rounded-[20px] shadow-sm border border-gray-100">
                        <h4 className="font-bold text-gray-700 mb-3 text-sm flex items-center gap-2">
                            <Plus size={16} className="bg-teal-100 text-teal-600 rounded-full p-0.5"/> 新增一筆
                        </h4>
                        <form onSubmit={handleAddExpense} className="space-y-3">
                            <div className="flex gap-2">
                            <input 
                                type="text" 
                                placeholder="品項 (如: 晚餐)" 
                                className="flex-1 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all"
                                value={newExpense.item}
                                onChange={(e) => setNewExpense({...newExpense, item: e.target.value})}
                            />
                            <input 
                                type="number" 
                                placeholder="¥ 金額" 
                                className="w-24 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none transition-all"
                                value={newExpense.cost}
                                onChange={(e) => setNewExpense({...newExpense, cost: e.target.value})}
                            />
                            </div>
                            <div className="flex gap-2">
                            <select 
                                className="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none text-gray-600 flex-1"
                                value={newExpense.payer}
                                onChange={(e) => setNewExpense({...newExpense, payer: e.target.value})}
                            >
                                <option value="我">我先付</option>
                                <option value="公費">公費支出</option>
                                <option value="刷卡">信用卡</option>
                            </select>
                            <button type="submit" className="flex-[2] bg-teal-500 text-white rounded-xl font-bold py-2.5 text-sm hover:bg-teal-600 active:scale-95 transition-all shadow-md shadow-teal-200">
                                記帳
                            </button>
                            </div>
                        </form>
                        </div>

                        {/* History List */}
                        <div className="space-y-2.5">
                        {expenses.length === 0 ? (
                            <div className="text-center text-gray-400 py-10 flex flex-col items-center gap-2">
                            <Coffee size={32} className="opacity-20"/>
                            <span className="text-sm">還沒有紀錄，開始你的第一筆消費吧！</span>
                            </div>
                        ) : (
                            expenses.map((ex) => (
                            <div key={ex.id} className="bg-white p-3.5 rounded-2xl flex justify-between items-center shadow-sm border border-gray-50 group">
                                <div className="flex flex-col">
                                <span className="font-bold text-gray-800 text-sm">{ex.item}</span>
                                <span className="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1">
                                    <span className={`w-1.5 h-1.5 rounded-full ${ex.payer === '公費' ? 'bg-orange-400' : 'bg-blue-400'}`}></span>
                                    {ex.payer}
                                </span>
                                </div>
                                <div className="flex items-center gap-3">
                                <span className="font-bold text-teal-600 font-mono">¥{Number(ex.cost).toLocaleString()}</span>
                                <button onClick={() => removeExpense(ex.id)} className="text-gray-300 hover:text-red-500 p-1 rounded-full hover:bg-red-50 transition-all">
                                    <Trash2 size={16} />
                                </button>
                                </div>
                            </div>
                            ))
                        )}
                        </div>
                    </div>
                    )}

                </div>

                {/* Floating Bottom Nav */}
                <nav className="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[92%] max-w-[380px] bg-white/90 backdrop-blur-md p-1.5 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/50 flex justify-between items-center z-50">
                    <button 
                    onClick={() => setActiveTab('itinerary')}
                    className={`flex items-center justify-center gap-2 flex-1 py-3 rounded-full transition-all duration-300 ${activeTab === 'itinerary' ? 'bg-red-500 text-white shadow-lg' : 'text-gray-400 hover:text-red-400'}`}
                    >
                    <Calendar size={18} />
                    {activeTab === 'itinerary' && <span className="text-xs font-bold animate-fade-in">行程</span>}
                    </button>
                    <button 
                    onClick={() => setActiveTab('guide')}
                    className={`flex items-center justify-center gap-2 flex-1 py-3 rounded-full transition-all duration-300 ${activeTab === 'guide' ? 'bg-orange-400 text-white shadow-lg' : 'text-gray-400 hover:text-orange-400'}`}
                    >
                    <Camera size={18} />
                    {activeTab === 'guide' && <span className="text-xs font-bold animate-fade-in">指南</span>}
                    </button>
                    <button 
                    onClick={() => setActiveTab('expenses')}
                    className={`flex items-center justify-center gap-2 flex-1 py-3 rounded-full transition-all duration-300 ${activeTab === 'expenses' ? 'bg-teal-500 text-white shadow-lg' : 'text-gray-400 hover:text-teal-400'}`}
                    >
                    <Wallet size={18} />
                    {activeTab === 'expenses' && <span className="text-xs font-bold animate-fade-in">記帳</span>}
                    </button>
                </nav>
                
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TripApp />);
    </script>
</body>
</html>
